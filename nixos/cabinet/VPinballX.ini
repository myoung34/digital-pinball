; Seeded once by NixOS (systemd-tmpfiles); VPX keeps its own edits here after that.
[Player]
PlayfieldDisplay = NS-40D420NA18 40"
PlayfieldFullScreen = 1
BGSet = 1
; The preload texture cache deadlocks table startup in this build (10.8.1-5436).
CacheMode = 0

[Backglass]
BackglassOutput = 1
BackglassDisplay = IPS0001 33"
BackglassFullScreen = 1

[Input]
Devices = Key;SDLJoy_0300908e341200001101000011010000_1
Device.SDLJoy_0300908e341200001101000011010000_1.Type = 2
Device.SDLJoy_0300908e341200001101000011010000_1.NoAutoLayout = 1
Device.SDLJoy_0300908e341200001101000011010000_1.Name = VirtuaPin Controller
; Keyboard defaults kept; VirtuaPin buttons are SDL indices (evdev code - BTN_TRIGGER).
Mapping.LeftFlipper = Key;225 | SDLJoy_0300908e341200001101000011010000_1;9
Mapping.RightFlipper = Key;229 | SDLJoy_0300908e341200001101000011010000_1;1
Mapping.LeftMagna = Key;224 | SDLJoy_0300908e341200001101000011010000_1;10
Mapping.RightMagna = Key;228 | SDLJoy_0300908e341200001101000011010000_1;2
Mapping.Start = Key;30 | SDLJoy_0300908e341200001101000011010000_1;8
Mapping.Credit1 = Key;34 | SDLJoy_0300908e341200001101000011010000_1;6
Mapping.ExitGame = Key;41 | SDLJoy_0300908e341200001101000011010000_1;7
Mapping.LaunchBall = Key;40 | SDLJoy_0300908e341200001101000011010000_1;15

[Plugin.DMDUtil]
Enable = 1
; The bundled libdmdutil can't drive a PinDMD3; send frames to the dmdserver service
; (FindDisplays is what opens the DMDServer connection).
FindDisplays = 1
DMDServer = 1
DMDServerAddr = 127.0.0.1
DMDServerPort = 6789
; The DMD browns out at full brightness: run monochrome dots at ~50%.
LumTintR = 128
LumTintG = 44
LumTintB = 16
