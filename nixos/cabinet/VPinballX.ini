; Seeded once by NixOS (systemd-tmpfiles); VPX keeps its own edits here after that.
[Player]
PlayfieldDisplay = NS-40D420NA18 40"
PlayfieldFullScreen = 1
BGSet = 1
; The preload texture cache deadlocks table startup in this build (10.8.1-5436).
CacheMode = 0
; Physical playfield TV (cm, from its EDID) for the cabinet 'window' projection.
ScreenWidth = 89.0
ScreenHeight = 50.0
CabinetAutofitMode = 1
; Frame pacing with a single frame in flight keeps flipper latency low.
SyncMode = 3
GfxBackend = Vulkan
MaxPrerenderedFrames = 1

[TableOverride]
; Window mode + autofit ignores ViewCabRotation; the TV is flipped in X instead (cabinet.nix).
ViewCabMode = 2

[Backglass]
; Tables without a real .directb2s get one built from their art (make-directb2s).
BackglassOutput = 1
BackglassDisplay = IPS0001 33"
BackglassFullScreen = 1

[Input]
Devices = Key;SDLJoy_0300264a341200001101000001000000_1;SDLJoy_0300908e341200001101000011010000_1
; Buttons come straight from the raw VirtuaPin (no userspace hop); only the
; plunger comes from the signed copy published by the virtuapin-fix service.
Device.SDLJoy_0300264a341200001101000001000000_1.Type = 2
Device.SDLJoy_0300264a341200001101000001000000_1.NoAutoLayout = 1
Device.SDLJoy_0300264a341200001101000001000000_1.Name = VirtuaPin Controller (signed)
Device.SDLJoy_0300908e341200001101000011010000_1.Type = 2
Device.SDLJoy_0300908e341200001101000011010000_1.NoAutoLayout = 1
Device.SDLJoy_0300908e341200001101000011010000_1.Name = VirtuaPin Controller
; Keyboard defaults kept; VirtuaPin buttons are SDL indices (evdev code - BTN_TRIGGER).
Mapping.LeftFlipper = Key;225 | SDLJoy_0300908e341200001101000011010000_1;9
Mapping.RightFlipper = Key;229 | SDLJoy_0300908e341200001101000011010000_1;1
Mapping.LeftMagna = Key;224 | SDLJoy_0300908e341200001101000011010000_1;10
Mapping.RightMagna = Key;228 | SDLJoy_0300908e341200001101000011010000_1;2
Mapping.Start = Key;30 | SDLJoy_0300908e341200001101000011010000_1;8
Mapping.Credit1 = Key;34 | SDLJoy_0300908e341200001101000011010000_1;6
Mapping.ExitGame = Key;41 | SDLJoy_0300908e341200001101000011010000_1;7
; Analog plunger: Z axis (0x0200 | 2), 0 at rest, 1 fully pulled. The 10% dead
; zone lets a light pull fall back instead of launching.
PlungerSensorCount = 1
Mapping.Plunger0.Position = SDLJoy_0300264a341200001101000001000000_1;514;P;0.100000;1.000000;1.000000

[Plugin.DMDUtil]
Enable = 1
; The bundled libdmdutil can't drive a PinDMD3; send frames to the dmdserver service
; (FindDisplays is what opens the DMDServer connection).
FindDisplays = 1
DMDServer = 1
DMDServerAddr = 127.0.0.1
DMDServerPort = 6789
; The DMD browns out at full brightness: run monochrome dots at ~50%.
LumTintR = 128
LumTintG = 44
LumTintB = 16
